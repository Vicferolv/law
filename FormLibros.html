<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo libro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg p-8 space-y-6 bg-white rounded-xl shadow-2xl border border-gray-100">
        <h2 class="text-3xl font-extrabold text-center text-gray-900 border-b pb-4">
            Añadir nuevo libro
        </h2>

        <form action="crealibro.php" method="POST" class="space-y-6">

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre del Libro</label>
                <input id="nombre" name="nombre" type="text" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="autor" class="block text-sm font-medium text-gray-700">Autor</label>
                <input id="autor" name="autor" type="text" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
<div>
                <label for="isbn" class="block text-sm font-medium text-gray-700">ISBN</label>
                <input id="isbn" name="isbn" type="text" maxlength="13" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="puntuacion" class="block text-sm font-medium text-gray-700">Puntuación</label>
                <input id="puntuacion" name="puntuacion" type="number" min="1" max="100" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="genero" class="block text-sm font-medium text-gray-700">Género</label>
                <input id="genero" name="genero" type="text" required 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-semibold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
                    Crear libro
                </button>
            </div>
        </form>
    </div>
</body>
</html>
